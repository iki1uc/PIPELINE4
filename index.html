<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>PIPELINE4 · iki1uc</title>

<style>
    body {
        background:#000;
        color:#0f0;
        font-family:Consolas, monospace;
        padding:20px;
    }
    h1 { color:#6cf; }
    pre {
        background:#111;
        padding:12px;
        border:1px solid #333;
        border-radius:6px;
        color:#0f0;
    }
    .block { margin-bottom:20px; }
</style>

<script type="module">

// =========================
// CSV Loader
// =========================

async function loadCSV(name){
    const res = await fetch(name);
    const text = await res.text();
    return text.split("\n").map(r => r.split(","));
}

// =========================
// PIPELINE4 Start
// =========================

async function PIPELINE4_START(){

    // Pipeline‑Daten
    const p3 = await loadCSV("3.csv");
    const p6 = await loadCSV("6.csv");
    const p9 = await loadCSV("9.csv");

    // ID‑Modul
    const id = await fetch("id.html").then(r => r.text());

    return {
        pipeline: {
            p3,
            p6,
            p9
        },
        id
    };
}

// =========================
// UI
// =========================

window.onload = async () => {
    const out = await PIPELINE4_START();
    document.getElementById("out").textContent =
        JSON.stringify(out, null, 2);
};
</script>

</head>

<body>

<h1>PIPELINE4 · iki1uc</h1>

<div class="block">
    <pre id="out">Lade PIPELINE4…</pre>
</div>

</body>
</html>
